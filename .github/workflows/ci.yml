name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check
        run: python -m py_compile ublcheck.py serve.py

      # The browser<->CLI parity test needs Node + @xmldom/xmldom; without it
      # that one test self-skips (suite still passes). Install so it runs here.
      - name: Set up Node (for browser/CLI parity test)
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install xmldom (for parity test)
        if: matrix.python-version == '3.12'
        run: npm install --no-save @xmldom/xmldom

      - name: Run full test suite (happy path + edge cases)
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          printf '%s' '<Invoice xmlns="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2"></Invoice>' > /tmp/smoke.xml
          python ublcheck.py /tmp/smoke.xml || test $? -eq 2

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build backend
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Show artifacts
        run: ls -la dist/
